apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: the-project
  template:
    metadata:
      labels:
        app: the-project
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: the-project
          image: tvaanane02/the_project:1.12
          env:
            - name: PORT
              value: "8000"
            - name: IMAGE_DIR
              value: "/usr/src/app/files"
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
              subPath: the-project